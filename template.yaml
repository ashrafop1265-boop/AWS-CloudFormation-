AWSTemplateFormatVersion: '2010-09-09'
Description: Event-driven serverless file processing with S3, Lambda in a private subnet, and SNS.

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that will receive file-processing alerts.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Enter a valid email address.
  BucketName:
    Type: String
    Description: Globally unique lowercase S3 bucket name (3-63 characters).
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^[a-z0-9][a-z0-9.-]*[a-z0-9]$'
    ConstraintDescription: Use 3-63 lowercase letters, numbers, dots, or hyphens; start and end with a letter or number.

Resources:
  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts

  FileProcessingEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref FileProcessingTopic

  FileProcessingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: TA2-IGW

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FileProcessingVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TA2-Public-Subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: TA2-Private-Subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: TA2-Public-RT

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: TA2-NAT-EIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicSubnetRouteAssociation
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: TA2-NAT-Gateway

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: TA2-Private-RT

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FileProcessingVPC
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound access for the file-processing Lambda.
      VpcId: !Ref FileProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TA2-Lambda-SG

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3AndSNSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/*'
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FileProcessingTopic

  FileProcessorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TA2-FileProcessor
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileProcessingTopic
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone

          s3 = boto3.client("s3")
          sns = boto3.client("sns")

          def lambda_handler(event, context):
              results = []
              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                  head = s3.head_object(Bucket=bucket, Key=key)
                  metadata = {
                      "source_bucket": bucket,
                      "source_key": key,
                      "size_bytes": head.get("ContentLength", 0),
                      "content_type": head.get("ContentType", "unknown"),
                      "processed_at_utc": datetime.now(timezone.utc).isoformat(),
                      "status": "SUCCESS"
                  }
                  log_key = "processed-logs/" + key.replace("/", "_") + ".json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=log_key,
                      Body=json.dumps(metadata, indent=2).encode("utf-8"),
                      ContentType="application/json"
                  )
                  results.append(metadata)

              if results:
                  sns.publish(
                      TopicArn=os.environ["SNS_TOPIC_ARN"],
                      Subject="S3 File Processing Successful",
                      Message=json.dumps({"message": "File processing completed.", "files": results}, indent=2)
                  )
              return {"statusCode": 200, "processed": len(results)}

  AllowS3InvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt FileProcessorLambda.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'

  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - AllowS3InvokeLambda
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FileProcessorLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      Tags:
        - Key: Name
          Value: TA2-Upload-Bucket

Outputs:
  UploadBucketName:
    Description: Upload test files to this bucket.
    Value: !Ref UploadBucket
  LambdaFunctionName:
    Value: !Ref FileProcessorLambda
  SNSTopicArn:
    Value: !Ref FileProcessingTopic
  VPCId:
    Value: !Ref FileProcessingVPC
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
